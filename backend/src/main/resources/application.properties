spring.application.name=backend
server.port=8080

# 1: Connect to MySQL Database: "QuanLyVanTai"
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:QuanLyVanTai}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
# Đặt mật khẩu qua biến môi trường DB_PASSWORD (không commit mật khẩu vào git)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kocomk111}

# 2: JPA / Hibernate
# Dung validate de hibernate kiem tra khop cau truc entity voi bang ma khong sua doi bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl