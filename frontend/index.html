<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VietBus Transit - Quản Lý & Điều Hành Vận Tải Đường Dài</title>
    <meta name="description" content="Hệ thống điều hành vận tải hành khách liên tỉnh VietBus Transit. Quản lý chuyến xe, chu kỳ bảo dưỡng quy đổi 10.000 km, doanh thu và bảng lương tài xế." />
    <!-- Google Font Plus Jakarta Sans & Inter (Modern, Clean, No slashed zero) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!-- Áp dụng giao diện sáng/tối đã lưu (hoặc theo hệ điều hành) trước khi vẽ trang -->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
