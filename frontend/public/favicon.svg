<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Logo hệ thống quản lý xe khách">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="kinh" x1="0" y1="15" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Nền bo góc -->
  <rect width="48" height="48" rx="13" fill="url(#nen)"/>
  <path d="M0 13 A13 13 0 0 1 13 0 H35 A13 13 0 0 1 48 13 V18 C34 12 14 12 0 22 Z" fill="#fff" opacity=".08"/>

  <!-- Con đường phía dưới -->
  <path d="M5 42 Q24 34 43 42" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>

  <!-- Gương chiếu hậu -->
  <path d="M12.5 15.5 H10 a1.2 1.2 0 0 0 -1.2 1.2 V21" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35.5 15.5 H38 a1.2 1.2 0 0 1 1.2 1.2 V21" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bánh xe -->
  <rect x="14" y="33" width="5.5" height="5.5" rx="1.6" fill="#0f172a"/>
  <rect x="28.5" y="33" width="5.5" height="5.5" rx="1.6" fill="#0f172a"/>

  <!-- Thân xe khách nhìn chính diện -->
  <rect x="12" y="8.5" width="24" height="27" rx="5.5" fill="#fff"/>
  <!-- Bảng tuyến -->
  <rect x="16.5" y="11" width="15" height="2.6" rx="1.3" fill="#f59e0b"/>
  <!-- Kính lái + vệt phản chiếu -->
  <rect x="14.5" y="15.5" width="19" height="10.5" rx="2.6" fill="url(#kinh)"/>
  <path d="M17.5 24 L22.5 17.5" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M21.5 24 L24.5 20" stroke="#fff" stroke-opacity=".2" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Đèn pha + lưới tản nhiệt -->
  <circle cx="17.3" cy="30.3" r="1.9" fill="#fbbf24"/>
  <circle cx="30.7" cy="30.3" r="1.9" fill="#fbbf24"/>
  <rect x="21" y="29.3" width="6" height="2" rx="1" fill="#cbd5e1"/>
</svg>
